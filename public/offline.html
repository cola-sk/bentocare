<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#f97316" />
    <title>网络暂时不可用 · 伴学小账</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; box-sizing: border-box; background: #faf9f6; color: #292524; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; text-align: center; }
      main { max-width: 320px; }
      img { width: 72px; height: 72px; }
      h1 { margin: 20px 0 8px; font-size: 20px; }
      p { color: #78716c; line-height: 1.6; }
      button { margin-top: 16px; border: 0; border-radius: 10px; padding: 12px 24px; background: #f97316; color: white; font: inherit; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <img src="/icon.svg" alt="" />
      <h1>网络暂时不可用</h1>
      <p>连接网络后重试，即可继续使用伴学小账。</p>
      <button type="button" onclick="location.reload()">重新加载</button>
    </main>
  </body>
</html>
